name: Release and supply-chain validation

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published annotated release used for production provenance verification
        required: true
        type: string

concurrency:
  group: ${{ github.event_name == 'push' && format('pe-community-release-{0}', github.ref) || format('pe-community-supply-chain-validation-{0}', github.ref) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      build_version: ${{ steps.release.outputs.build_version }}
      source_commit: ${{ steps.release.outputs.source_commit }}
      build_date: ${{ steps.release.outputs.build_date }}
      mode: ${{ steps.release.outputs.mode }}
      image_tag: ${{ steps.release.outputs.image_tag }}
      provenance_test_release_tag: ${{ steps.release.outputs.provenance_test_release_tag }}
      provenance_test_source_commit: ${{ steps.release.outputs.provenance_test_source_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          PROVENANCE_TEST_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            RELEASE_REF="$RELEASE_REF" RELEASE_REF_TYPE="$REF_TYPE" CHECKOUT_SHA="$DISPATCH_SHA" bash .github/scripts/validate-release-ref.sh
            source_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
            echo "build_version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "image_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            [[ "$REF_TYPE" == "branch" && "$RELEASE_TAG" == "main" ]] || { echo "Manual validation must run from main." >&2; exit 1; }
            [[ "$DISPATCH_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "Validation dispatch SHA is invalid." >&2; exit 1; }
            [[ "$PROVENANCE_TEST_RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "Historical provenance release tag must be strict stable semver." >&2; exit 1; }
            tag_ref="refs/tags/$PROVENANCE_TEST_RELEASE_TAG"
            git fetch --force --no-tags origin "$tag_ref:$tag_ref"
            [[ "$(git cat-file -t "$tag_ref")" == "tag" ]] || { echo "Historical provenance release tag must be annotated." >&2; exit 1; }
            provenance_test_source_commit="$(git rev-parse "$tag_ref^{commit}")"
            [[ "$provenance_test_source_commit" =~ ^[a-f0-9]{40}$ ]] || { echo "Historical provenance release tag did not resolve to a commit." >&2; exit 1; }
            echo "build_version=v0.0.0-validation.$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "version=v0.0.0-validation.$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "source_commit=$DISPATCH_SHA" >> "$GITHUB_OUTPUT"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
            echo "mode=validation" >> "$GITHUB_OUTPUT"
            echo "image_tag=validation-$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "provenance_test_release_tag=$PROVENANCE_TEST_RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "provenance_test_source_commit=$provenance_test_source_commit" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      api_digest: ${{ steps.api.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
      worker_digest: ${{ steps.worker.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/pona-ekolo/pe-community-api:${{ needs.validate.outputs.image_tag }}
          build-args: |
            APP_VERSION=${{ needs.validate.outputs.version }}
            SOURCE_COMMIT=${{ needs.validate.outputs.source_commit }}
            BUILD_DATE=${{ needs.validate.outputs.build_date }}
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/pona-ekolo/pe-community-api
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true
      - id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/pona-ekolo/pe-community-web:${{ needs.validate.outputs.image_tag }}
          build-args: |
            APP_VERSION=${{ needs.validate.outputs.version }}
            SOURCE_COMMIT=${{ needs.validate.outputs.source_commit }}
            BUILD_DATE=${{ needs.validate.outputs.build_date }}
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/pona-ekolo/pe-community-web
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true
      - id: worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ghcr.io/pona-ekolo/pe-community-worker:${{ needs.validate.outputs.image_tag }}
          build-args: |
            APP_VERSION=${{ needs.validate.outputs.version }}
            SOURCE_COMMIT=${{ needs.validate.outputs.source_commit }}
            BUILD_DATE=${{ needs.validate.outputs.build_date }}
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/pona-ekolo/pe-community-worker
          subject-digest: ${{ steps.worker.outputs.digest }}
          push-to-registry: true

  artifacts:
    needs: [validate, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pe/updater build
      - name: Build final release artifacts
        env:
          BUILD_VERSION: ${{ needs.validate.outputs.build_version }}
          MODE: ${{ needs.validate.outputs.mode }}
          BUILD_DATE: ${{ needs.validate.outputs.build_date }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
          API_DIGEST: ${{ needs.image.outputs.api_digest }}
          WEB_DIGEST: ${{ needs.image.outputs.web_digest }}
          WORKER_DIGEST: ${{ needs.image.outputs.worker_digest }}
        run: |
          set -euo pipefail
          for digest in "$API_DIGEST" "$WEB_DIGEST" "$WORKER_DIGEST"; do
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Image digest is missing or invalid." >&2; exit 1; }
          done
          if [[ "$MODE" == "release" ]]; then
            jq -n \
              --arg version "$BUILD_VERSION" \
              --arg buildDate "$BUILD_DATE" \
              --arg sourceCommit "$SOURCE_COMMIT" \
              --arg apiDigest "$API_DIGEST" \
              --arg webDigest "$WEB_DIGEST" \
              --arg workerDigest "$WORKER_DIGEST" \
              '{schemaVersion:2,releaseContractVersion:1,version:$version,releaseTag:$version,channel:"stable",minimumVersion:"v0.1.0",minimumUpdaterVersion:"v1.4.0",sourceCommit:$sourceCommit,buildDate:$buildDate,images:{api:{repository:"ghcr.io/pona-ekolo/pe-community-api",digest:$apiDigest},web:{repository:"ghcr.io/pona-ekolo/pe-community-web",digest:$webDigest},worker:{repository:"ghcr.io/pona-ekolo/pe-community-worker",digest:$workerDigest}},database:{migrationCompatibility:"FORWARD_ONLY"},supplyChain:{attestationPolicy:"GITHUB_PROVENANCE_REQUIRED"},requiresManualAction:false}' \
              > pe-community-update-manifest.json
            node --input-type=module -e "import { readFileSync } from 'node:fs'; const { validateManifest } = await import('./apps/updater/dist/domain.js'); validateManifest(JSON.parse(readFileSync('pe-community-update-manifest.json', 'utf8')))"
          else
            jq -n \
              --arg buildVersion "$BUILD_VERSION" \
              --arg buildDate "$BUILD_DATE" \
              --arg sourceCommit "$SOURCE_COMMIT" \
              --arg apiDigest "$API_DIGEST" \
              --arg webDigest "$WEB_DIGEST" \
              --arg workerDigest "$WORKER_DIGEST" \
              '{schemaVersion:1,type:"supply-chain-validation",buildVersion:$buildVersion,sourceCommit:$sourceCommit,buildDate:$buildDate,images:{api:{repository:"ghcr.io/pona-ekolo/pe-community-api",digest:$apiDigest},web:{repository:"ghcr.io/pona-ekolo/pe-community-web",digest:$webDigest},worker:{repository:"ghcr.io/pona-ekolo/pe-community-worker",digest:$workerDigest}}}' \
              > pe-community-validation-manifest.json
          fi

          GH_VERSION=2.93.0
          verify_bundled_gh() {
            local architecture="$1"
            local gh_binary="$2"
            local expected_machine actual_machine version_line

            if [[ ! -f "$gh_binary" || -L "$gh_binary" ]]; then
              echo "BUNDLED_GH_MISSING" >&2
              return 1
            fi
            if [[ ! -x "$gh_binary" ]]; then
              echo "BUNDLED_GH_NOT_EXECUTABLE" >&2
              return 1
            fi

            case "$architecture" in
              linux-amd64) expected_machine="Advanced Micro Devices X86-64" ;;
              linux-arm64) expected_machine="AArch64" ;;
              *) echo "BUNDLED_GH_ARCHITECTURE_UNSUPPORTED" >&2; return 1 ;;
            esac
            if ! actual_machine="$(LC_ALL=C readelf -h "$gh_binary" 2>/dev/null | awk -F: '/^[[:space:]]*Machine:/{gsub(/^[[:space:]]+/, "", $2); print $2; exit}')"; then
              echo "BUNDLED_GH_ARCHITECTURE_MISMATCH" >&2
              return 1
            fi
            [[ "$actual_machine" == "$expected_machine" ]] || { echo "BUNDLED_GH_ARCHITECTURE_MISMATCH" >&2; return 1; }

            if [[ "$architecture" == "linux-amd64" ]]; then
              if ! version_line="$("$gh_binary" version | head -n1)"; then
                echo "BUNDLED_GH_VERSION_MISMATCH" >&2
                return 1
              fi
              [[ "$version_line" == "gh version ${GH_VERSION} "* ]] || { echo "BUNDLED_GH_VERSION_MISMATCH" >&2; return 1; }
            fi
          }
          updaters=()
          for architecture in linux-amd64 linux-arm64; do
            case "$architecture" in
              linux-amd64)
                gh_archive="gh_${GH_VERSION}_linux_amd64.tar.gz"
                gh_sha256="02d1290eba130e0b896f3709ffff22e1c75a51475ddb70476a85abc6b5807af0"
                ;;
              linux-arm64)
                gh_archive="gh_${GH_VERSION}_linux_arm64.tar.gz"
                gh_sha256="c55feb33684abba57e9909737340d5b39282257c0363e1edde6785ac4a413be7"
                ;;
              *) echo "Unsupported updater architecture." >&2; exit 1 ;;
            esac
            curl --fail --location --proto '=https' --tlsv1.2 \
              --output "$gh_archive" \
              "https://github.com/cli/cli/releases/download/v${GH_VERSION}/${gh_archive}"
            printf '%s  %s\n' "$gh_sha256" "$gh_archive" | sha256sum --check --status
            node --input-type=module -e "import { readFileSync } from 'node:fs'; import { execFileSync } from 'node:child_process'; import { verifyPinnedArchive, verifyUpstreamArchiveEntries } from './deploy/updater/bundle-contract.mjs'; const [architecture, archive] = process.argv.slice(1); verifyPinnedArchive(readFileSync(archive), architecture); verifyUpstreamArchiveEntries(execFileSync('tar', ['-tzf', archive], { encoding: 'utf8' }).trim().split('\\n'), architecture);" "$architecture" "$gh_archive"
            extract_root="gh_${GH_VERSION}_${architecture//-/_}"
            rm -rf "$extract_root" pe-community-updater
            tar -xzf "$gh_archive" --no-same-owner --no-same-permissions
            gh_binary="$extract_root/bin/gh"
            verify_bundled_gh "$architecture" "$gh_binary"
            mkdir -p pe-community-updater/bin pe-community-updater/dist pe-community-updater/deploy pe-community-updater/LICENSES
            cp -R apps/updater/dist/. pe-community-updater/dist/
            cp apps/updater/package.json pe-community-updater/package.json
            cp "$gh_binary" pe-community-updater/bin/gh
            chmod 0755 pe-community-updater/bin/gh
            cp "$extract_root/LICENSE" pe-community-updater/LICENSES/github-cli-MIT.txt
            cp deploy/updater/README.md deploy/updater/SECURITY.md deploy/updater/pe-community-updater.env.example deploy/updater/pe-community-updater.service deploy/updater/docker-compose.updater.yml deploy/updater/install.sh pe-community-updater/deploy/
            chmod 0755 pe-community-updater/deploy/install.sh
            cp deploy/updater/pe-community-updater pe-community-updater/bin/pe-community-updater
            chmod 0755 pe-community-updater/bin/pe-community-updater
            updater="pe-community-updater-${BUILD_VERSION}-${architecture}.tar.gz"
            tar --owner=0 --group=0 --numeric-owner --mode='u=rwX,go=rX' -czf "$updater" pe-community-updater
            node --input-type=module -e "import { execFileSync } from 'node:child_process'; import { verifyBundleEntries } from './deploy/updater/bundle-contract.mjs'; const archive = process.argv[1]; verifyBundleEntries(execFileSync('tar', ['-tzf', archive], { encoding: 'utf8' }).trim().split('\\n'));" "$updater"
            updaters+=("$updater")
          done
      - id: manifest-attestation
        name: Attest final update manifest
        if: needs.validate.outputs.mode == 'release'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: pe-community-update-manifest.json
      - name: Prepare attestation bundle
        if: needs.validate.outputs.mode == 'release'
        env:
          BUNDLE_PATH: ${{ steps.manifest-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -f "$BUNDLE_PATH"
          cp "$BUNDLE_PATH" pe-community-update-manifest.attestation.json
      - name: Verify current validation and historical release provenance with the bundled CLI
        if: needs.validate.outputs.mode == 'validation'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ needs.validate.outputs.build_version }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
          PROVENANCE_TEST_RELEASE_TAG: ${{ needs.validate.outputs.provenance_test_release_tag }}
          PROVENANCE_TEST_SOURCE_COMMIT: ${{ needs.validate.outputs.provenance_test_source_commit }}
          API_DIGEST: ${{ needs.image.outputs.api_digest }}
          WEB_DIGEST: ${{ needs.image.outputs.web_digest }}
          WORKER_DIGEST: ${{ needs.image.outputs.worker_digest }}
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          archive="pe-community-updater-${BUILD_VERSION}-linux-amd64.tar.gz"
          tar -xzf "$archive" -C "$stage"
          bundled_gh="$stage/pe-community-updater/bin/gh"
          test -f "$bundled_gh" && test ! -L "$bundled_gh" && test -x "$bundled_gh"
          [[ "$("$bundled_gh" version | head -n1)" == "gh version 2.93.0 "* ]] || { echo "BUNDLED_GH_VERSION_INVALID" >&2; exit 1; }
          node deploy/updater/verify-bundled-validation-provenance.mjs --gh "$bundled_gh" --service api --digest "$API_DIGEST" --source-commit "$SOURCE_COMMIT"
          echo 'Current validation API provenance: verified'
          node deploy/updater/verify-bundled-validation-provenance.mjs --gh "$bundled_gh" --service web --digest "$WEB_DIGEST" --source-commit "$SOURCE_COMMIT"
          echo 'Current validation Web provenance: verified'
          node deploy/updater/verify-bundled-validation-provenance.mjs --gh "$bundled_gh" --service worker --digest "$WORKER_DIGEST" --source-commit "$SOURCE_COMMIT"
          echo 'Current validation Worker provenance: verified'

          release="$($bundled_gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PROVENANCE_TEST_RELEASE_TAG")"
          [[ "$(jq -r '.draft' <<<"$release")" == "false" ]] || { echo "Historical provenance release must be published." >&2; exit 1; }
          [[ "$(jq -r '.prerelease' <<<"$release")" == "false" ]] || { echo "Historical provenance release must be stable." >&2; exit 1; }
          [[ "$(jq -r '.tag_name' <<<"$release")" == "$PROVENANCE_TEST_RELEASE_TAG" ]] || { echo "Historical provenance release tag mismatch." >&2; exit 1; }
          historical_asset_count() {
            jq --arg name "$1" '[.assets[]? | select(.name == $name)] | length' <<<"$release"
          }
          [[ "$(historical_asset_count pe-community-update-manifest.json)" == "1" ]] || { echo "HISTORICAL_RELEASE_MANIFEST_MISSING" >&2; exit 1; }
          [[ "$(historical_asset_count pe-community-update-manifest.attestation.json)" == "1" ]] || { echo "HISTORICAL_RELEASE_MANIFEST_ATTESTATION_MISSING" >&2; exit 1; }
          historical_manifest="$stage/pe-community-update-manifest.json"
          "$bundled_gh" release download "$PROVENANCE_TEST_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern pe-community-update-manifest.json --output "$historical_manifest"
          "$bundled_gh" attestation verify "$historical_manifest" --repo Pona-Ekolo/PE-Community --hostname github.com --signer-workflow Pona-Ekolo/PE-Community/.github/workflows/publish-images.yml --predicate-type https://slsa.dev/provenance/v1 --cert-oidc-issuer https://token.actions.githubusercontent.com --source-ref "refs/tags/$PROVENANCE_TEST_RELEASE_TAG" --source-digest "$PROVENANCE_TEST_SOURCE_COMMIT" --deny-self-hosted-runners --limit 10 > "$stage/historical-manifest-verification.txt"
          echo "Historical ${PROVENANCE_TEST_RELEASE_TAG} manifest provenance: verified"
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const { validateManifest } = await import('./apps/updater/dist/domain.js'); const [file, tag, commit] = process.argv.slice(1); const raw = JSON.parse(readFileSync(file, 'utf8')); const digestErrors = Object.freeze({ api: 'HISTORICAL_RELEASE_API_DIGEST_MISSING', web: 'HISTORICAL_RELEASE_WEB_DIGEST_MISSING', worker: 'HISTORICAL_RELEASE_WORKER_DIGEST_MISSING' }); if (!raw || typeof raw !== 'object' || raw.releaseContractVersion !== 1) throw new Error('HISTORICAL_RELEASE_CONTRACT_UNSUPPORTED'); for (const [service, errorCode] of Object.entries(digestErrors)) { const image = raw.images?.[service]; if (!image || typeof image.digest !== 'string' || !/^sha256:[a-f0-9]{64}$/.test(image.digest)) throw new Error(errorCode); } const manifest = validateManifest(raw); if (manifest.releaseTag !== tag || manifest.sourceCommit !== commit || manifest.supplyChain.attestationPolicy !== 'GITHUB_PROVENANCE_REQUIRED') throw new Error('HISTORICAL_RELEASE_MANIFEST_INVALID'); for (const service of Object.keys(digestErrors)) console.log('HISTORICAL_' + service.toUpperCase() + '_DIGEST=' + manifest.images[service].digest);" "$historical_manifest" "$PROVENANCE_TEST_RELEASE_TAG" "$PROVENANCE_TEST_SOURCE_COMMIT" > "$stage/historical-images.env"
          source "$stage/historical-images.env"
          node deploy/updater/verify-bundled-provenance.mjs --gh "$bundled_gh" --service api --repository ghcr.io/pona-ekolo/pe-community-api --digest "$HISTORICAL_API_DIGEST" --release-tag "$PROVENANCE_TEST_RELEASE_TAG" --source-commit "$PROVENANCE_TEST_SOURCE_COMMIT"
          echo "Historical ${PROVENANCE_TEST_RELEASE_TAG} API provenance: verified"
          node deploy/updater/verify-bundled-provenance.mjs --gh "$bundled_gh" --service web --repository ghcr.io/pona-ekolo/pe-community-web --digest "$HISTORICAL_WEB_DIGEST" --release-tag "$PROVENANCE_TEST_RELEASE_TAG" --source-commit "$PROVENANCE_TEST_SOURCE_COMMIT"
          echo "Historical ${PROVENANCE_TEST_RELEASE_TAG} Web provenance: verified"
          node deploy/updater/verify-bundled-provenance.mjs --gh "$bundled_gh" --service worker --repository ghcr.io/pona-ekolo/pe-community-worker --digest "$HISTORICAL_WORKER_DIGEST" --release-tag "$PROVENANCE_TEST_RELEASE_TAG" --source-commit "$PROVENANCE_TEST_SOURCE_COMMIT"
          echo "Historical ${PROVENANCE_TEST_RELEASE_TAG} Worker provenance: verified"
          if node deploy/updater/verify-bundled-provenance.mjs --gh "$bundled_gh" --service api --repository ghcr.io/pona-ekolo/pe-community-web --digest "$HISTORICAL_API_DIGEST" --release-tag "$PROVENANCE_TEST_RELEASE_TAG" --source-commit "$PROVENANCE_TEST_SOURCE_COMMIT"; then
            echo "PROVENANCE_POLICY_REPOSITORY_MISMATCH_NOT_REJECTED" >&2
            exit 1
          fi
      - name: Upload packaged validation artifacts
        if: needs.validate.outputs.mode == 'validation'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supply-chain-validation-${{ github.run_id }}
          path: |
            pe-community-validation-manifest.json
            pe-community-updater-${{ needs.validate.outputs.build_version }}-linux-amd64.tar.gz
            pe-community-updater-${{ needs.validate.outputs.build_version }}-linux-arm64.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Upload packaged release artifacts
        if: needs.validate.outputs.mode == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supply-chain-release-${{ github.run_id }}
          path: |
            pe-community-update-manifest.json
            pe-community-update-manifest.attestation.json
            pe-community-updater-${{ needs.validate.outputs.build_version }}-linux-amd64.tar.gz
            pe-community-updater-${{ needs.validate.outputs.build_version }}-linux-arm64.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Write validation summary
        if: needs.validate.outputs.mode == 'validation'
        env:
          API_DIGEST: ${{ needs.image.outputs.api_digest }}
          WEB_DIGEST: ${{ needs.image.outputs.web_digest }}
          WORKER_DIGEST: ${{ needs.image.outputs.worker_digest }}
        run: |
          {
            echo '## Supply-chain validation passed'
            echo
            echo "Source commit: \`${{ needs.validate.outputs.source_commit }}\`"
            echo "Historical production provenance release: \`${{ needs.validate.outputs.provenance_test_release_tag }}\`"
            echo "Validation run: \`${{ github.run_id }}\`"
            echo
            echo "- API digest: \`$API_DIGEST\`"
            echo "- Web digest: \`$WEB_DIGEST\`"
            echo "- Worker digest: \`$WORKER_DIGEST\`"
            echo '- Current main API/Web/Worker attestations: verified by bundled gh with CI-only main policy'
            echo '- Historical release API/Web/Worker attestations: verified by bundled gh with the production tag-bound policy'
            echo '- Updater amd64/arm64 bundles: contract passed'
            echo '- Bundled gh version: `2.93.0`'
            echo '- Bundled live verifier: passed'
            echo '- Wrong repository policy check: rejected'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    if: github.event_name == 'push'
    needs: [validate, artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: supply-chain-release-${{ github.run_id }}
          path: release-artifacts
      - name: Create validated draft and publish atomically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.build_version }}
          VERSION: ${{ needs.validate.outputs.build_version }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
          RELEASE_ARTIFACT_DIRECTORY: release-artifacts
        run: |
          set -euo pipefail
          node .github/scripts/publish-release-draft.mjs
